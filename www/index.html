<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1220">
<title>Telecast — Live TV</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
:root{
  --bg:#0d0d0f;
  --panel:#151518;
  --panel2:#1b1b1f;
  --line:rgba(255,255,255,.10);
  --text:#f2f2f2;
  --muted:#96969d;
  --accent:#e6e6e6;
  --accent2:#ffffff;
  --danger:#c9c9c9;
  --shadow:0 20px 55px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  background:var(--bg);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
button,input,select{font:inherit}
.app{width:min(1180px,calc(100% - 32px));margin:auto;padding:28px 0 34px}
.header{
  display:flex;align-items:center;justify-content:space-between;gap:20px;
  padding:4px 0 26px;
}
.brand{display:flex;align-items:center;gap:14px}
.logo{
  width:52px;height:52px;object-fit:contain;border-radius:15px;
  background:#fff;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.22);
}
.brand h1{margin:0;font-size:25px;letter-spacing:-.5px}
.brand p{margin:3px 0 0;color:var(--muted);font-size:13px}
.live{
  display:flex;align-items:center;gap:8px;padding:9px 13px;border:1px solid var(--line);
  background:rgba(255,255,255,.035);border-radius:999px;color:#dce5f3;font-size:12px;font-weight:700;
}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px rgba(255,255,255,.45)}
.player-card{
  overflow:hidden;border:1px solid var(--line);background:linear-gradient(145deg,#101a2a,#0b111d);
  border-radius:22px;box-shadow:var(--shadow);
}
.player-wrap{position:relative;background:#000;aspect-ratio:16/9}
video{display:block;width:100%;height:100%;background:#000;object-fit:contain}
.player-placeholder{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;
  gap:10px;background:linear-gradient(145deg,#080c14,#0e1624);pointer-events:none;
}
.player-placeholder.hidden{display:none}
.play-icon{
  width:64px;height:64px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);font-size:25px;color:var(--accent);
}
.player-placeholder strong{font-size:17px}.player-placeholder span{color:var(--muted);font-size:13px}
.player-info{
  display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 18px;
}
.now{min-width:0}
.now small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}
#msg{font-size:15px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{color:var(--muted);font-size:12px;white-space:nowrap}
.search-panel{
  margin-top:20px;padding:20px;border:1px solid var(--line);background:rgba(15,23,38,.86);
  border-radius:20px;box-shadow:0 12px 35px rgba(0,0,0,.16);
}
.search-title{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:13px}
.search-title h2{font-size:17px;margin:0}.search-title span{font-size:12px;color:var(--muted)}
.search-row{display:flex;gap:10px}
.search-box{
  flex:1;min-width:0;height:48px;padding:0 16px;border:1px solid var(--line);outline:none;
  border-radius:13px;background:#0a111d;color:var(--text);transition:.2s;
}
.search-box::placeholder{color:#65748b}
.search-box:focus{border-color:rgba(255,255,255,.35);box-shadow:0 0 0 4px rgba(255,255,255,.05)}
.play-btn{
  height:48px;padding:0 22px;border:0;border-radius:13px;cursor:pointer;font-weight:800;
  color:#111111;background:#e8e8e8;
  box-shadow:0 8px 20px rgba(0,0,0,.18);transition:.2s;
}
.play-btn:hover{transform:translateY(-1px);filter:brightness(1.04)}
.channel-list{
  display:none;width:100%;margin-top:10px;max-height:280px;overflow:auto;
  border:1px solid var(--line);border-radius:13px;background:#0a111d;color:var(--text);
  padding:6px;
}
.channel-list option{padding:11px 12px;border-radius:8px;cursor:pointer}
.channel-list option:checked{background:#2a2a2e}
.empty{
  text-align:center;color:var(--muted);padding:22px;font-size:13px;display:none;
}
.footer{padding:24px 0 0;text-align:center;color:#65748b;font-size:12px}
.footer b{color:#9ba8bb;font-weight:600}
@media(max-width:650px){
  .app{width:min(100% - 20px,1180px);padding-top:15px}
  .header{padding-bottom:16px}.brand h1{font-size:21px}.logo{width:45px;height:45px}
  .live{padding:8px 10px}.player-card{border-radius:16px}
  .player-info{padding:13px}.status{display:none}
  .search-panel{padding:15px;border-radius:16px}
  .search-title{align-items:flex-start;flex-direction:column;gap:3px}
  .search-row{flex-direction:column}.play-btn{width:100%}
}
</style>
</head>
<body>
<main class="app">
  <header class="header">
    <div class="brand">
      <img class="logo" src="logo.png" alt="Telecast logo" onerror="this.style.display='none'">
      <div>
        <h1>Telecast</h1>
        <p>Live television, in one place</p>
      </div>
    </div>
    <div class="live"><span class="dot"></span> LIVE TV</div>
  </header>

  <section class="player-card">
    <div class="player-wrap">
      <video id="v" controls playsinline></video>
      <div id="placeholder" class="player-placeholder">
        <div class="play-icon">▶</div>
        <strong>Select a channel to start</strong>
        <span>Search below and choose any available stream</span>
      </div>
    </div>
    <div class="player-info">
      <div class="now">
        <small>Now playing</small>
        <div id="msg">Loading channels…</div>
      </div>
      <div id="count" class="status">Connecting to channel list</div>
    </div>
  </section>

  <section class="search-panel">
    <div class="search-title">
      <h2>Find a channel</h2>
      <span>Type at least 2 characters</span>
    </div>
    <div class="search-row">
      <input class="search-box" type="text" id="searchBox" placeholder="Search channel name…" autocomplete="off">
      <button class="play-btn" type="button" id="playBtn">Play channel</button>
    </div>
    <select id="ch" class="channel-list" size="7" aria-label="Channel results"></select>
    <div id="empty" class="empty">No matching channels found.</div>
  </section>

  <footer class="footer">Made by <b>Bhim Mondal</b></footer>
</main>

<script>
const M3U = "https://iptv-org.github.io/iptv/countries/in.m3u";
const video = document.getElementById("v");
const sel = document.getElementById("ch");
const searchBox = document.getElementById("searchBox");
const msg = document.getElementById("msg");
const count = document.getElementById("count");
const placeholder = document.getElementById("placeholder");
const empty = document.getElementById("empty");
const playBtn = document.getElementById("playBtn");

let hls = null;
let allChannels = [];

fetch(M3U)
  .then(r => {
    if (!r.ok) throw new Error("Network response failed");
    return r.text();
  })
  .then(data => {
    const lines = data.split(/\r?\n/);
    let name = "";
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i].trim();
      if (line.startsWith("#EXTINF")) {
        name = line.split(",").pop().trim();
      } else if (line.startsWith("http") && name) {
        allChannels.push({name, url: line});
        name = "";
      }
    }
    msg.textContent = "Ready — search for a channel";
    count.textContent = `${allChannels.length.toLocaleString()} channels available`;
  })
  .catch(() => {
    msg.textContent = "Unable to load channels";
    count.textContent = "Check your internet connection";
  });

function renderResults() {
  const text = searchBox.value.toLowerCase().trim();
  sel.innerHTML = "";
  empty.style.display = "none";

  if (text.length < 2) {
    sel.style.display = "none";
    return;
  }

  const filtered = allChannels.filter(c => c.name.toLowerCase().includes(text));
  filtered.slice(0, 80).forEach(channel => {
    const option = document.createElement("option");
    option.value = channel.url;
    option.textContent = channel.name;
    sel.appendChild(option);
  });

  if (filtered.length) {
    sel.style.display = "block";
    count.textContent = `${filtered.length.toLocaleString()} matching channel${filtered.length === 1 ? "" : "s"}`;
  } else {
    sel.style.display = "none";
    empty.style.display = "block";
    count.textContent = "No matches";
  }
}

searchBox.addEventListener("input", renderResults);

sel.addEventListener("change", () => {
  if (sel.value) playit();
});

playBtn.addEventListener("click", playit);

document.addEventListener("click", event => {
  if (event.target !== searchBox && event.target !== sel) {
    sel.style.display = "none";
  }
});

function playit() {
  const url = sel.value;
  const selectedOption = sel.options[sel.selectedIndex];

  if (!url || !selectedOption) {
    msg.textContent = "Select a channel first";
    return;
  }

  const name = selectedOption.textContent;
  msg.textContent = `Now playing: ${name}`;
  count.textContent = "Connecting to stream…";
  placeholder.classList.add("hidden");
  sel.style.display = "none";

  if (hls) {
    hls.destroy();
    hls = null;
  }
  video.pause();
  video.removeAttribute("src");
  video.load();

  if (window.Hls && Hls.isSupported()) {
    hls = new Hls({enableWorker:true});
    hls.loadSource(url);
    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      video.play().catch(() => {});
      count.textContent = "LIVE • Streaming";
    });

    hls.on(Hls.Events.ERROR, (_, data) => {
      if (data.fatal) {
        count.textContent = "Stream unavailable";
        msg.textContent = `Could not play: ${name}`;
        placeholder.classList.remove("hidden");
      }
    });
  } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
    video.src = url;
    video.addEventListener("loadedmetadata", () => {
      video.play().catch(() => {});
      count.textContent = "LIVE • Streaming";
    }, {once:true});
  } else {
    msg.textContent = "Browser not supported";
    count.textContent = "HLS playback is unavailable";
    placeholder.classList.remove("hidden");
  }
}
</script>
</body>
</html>
